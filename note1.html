<!DOCTYPE1 html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>词汇复习挑战 - ChineseInFlow 风格</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
/* 让整体容器适应屏幕大小，避免超出屏幕 */
body {
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
    width: 100vw;
    overflow-x: hidden; /* 防止横向出现滚动条 */
}

/* 闪卡容器自适应宽度 */
.container {
    width: 100% !important;
    max-width: 100% !important;
    padding: 0 10px;
    box-sizing: border-box;
}

/* 闪卡卡片高度与字号在手机端的优化 */
.flashcard-container {
    width: 100% !important;
    height: 220px !important; /* 手机端适当缩小卡片高度，防止纵向溢出 */
}

/* 手机端字体自适应控制 */
@media (max-width: 480px) {
    .card-front {
        font-size: 2.5rem !important; /* 缩小汉字字号 */
    }
    .pinyin {
        font-size: 1.4rem !important; /* 缩小拼音字号 */
    }
    .meaning {
        font-size: 1rem !important; /* 缩小释义字号 */
    }
}
        body {
            background-color: #1a2634;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* 游戏主容器（模拟16:9卡片风格） */
        .game-container {
            width: 900px;
            height: 580px;
            background: linear-gradient(to bottom, #436380 0%, #688fa8 50%, #9cb3a8 80%, #b8c4a9 100%);
            border-radius: 36px;
            border: 4px solid #ffffff;
            box-shadow: 0 16px 32px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
        }

        /* 背景雪山造型绘制 */
        .mountain-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            pointer-events: none;
            z-index: 1;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            border-style: solid;
        }

        .mountain-1 {
            left: -20px;
            border-width: 0 120px 110px 120px;
            border-color: transparent transparent #7a8288 transparent;
        }
        .mountain-1::after {
            content: '';
            position: absolute;
            top: 0;
            left: -40px;
            border-style: solid;
            border-width: 0 40px 35px 40px;
            border-color: transparent transparent #ffffff transparent;
        }

        .mountain-2 {
            right: -30px;
            border-width: 0 140px 130px 140px;
            border-color: transparent transparent #656d73 transparent;
        }

        .mountain-range {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background-color: #51585d;
            border-top: 3px solid #3c4246;
        }

        /* 顶栏与控制按钮 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .top-right-controls {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            background-color: #ffffff;
            border: 2px solid #555;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, background-color 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn.active {
            background-color: #d84315;
            color: white;
            border-color: #900;
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* 模式指示牌/状态通知 */
        .mode-banner {
            background-color: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 20px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* 目标汉字显示框 */
        .target-container {
            position: relative;
            align-self: center;
            margin-top: 10px;
            z-index: 10;
        }

        .target-card {
            background: #ffffff;
            border: 4px solid #666;
            border-radius: 36px;
            width: 320px;
            height: 125px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            position: relative;
            cursor: pointer;
        }

        .target-text {
            font-size: 52px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 2px;
        }

        /* 终极挑战模式下的数字徽章（30题倒计时） */
        .challenge-badge {
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            border: 3px solid #777;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            animation: pulseBadge 1.5s infinite alternate;
        }

        @keyframes pulseBadge {
            0% { transform: translateY(-50%) scale(1); }
            100% { transform: translateY(-50%) scale(1.08); }
        }

        /* 选项区域 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            margin-top: 10px;
            z-index: 10;
        }

        .options-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .option-btn {
            background-color: #d1d5f7;
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 12px 20px;
            min-width: 220px;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: all 0.25s ease;
        }

        .option-btn:hover {
            background-color: #e0e3ff;
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(1px);
        }

        .option-btn.fade-out {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.85);
        }

        .option-btn.correct {
            background-color: #a0e8a2 !important;
            border-color: #2e7d32 !important;
        }

        .option-btn.wrong {
            background-color: #ffab91 !important;
            border-color: #d84315 !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .pinyin-text {
            font-size: 26px;
            font-weight: bold;
            color: #2b2d42;
            line-height: 1.1;
        }

        .english-text {
            font-size: 15px;
            color: #5a5d7a;
            margin-top: 3px;
            text-align: center;
        }

        /* 底部控制栏与时间条 */
        .bottom-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
            margin-top: auto;
        }

        .bottom-left-btns {
            display: flex;
            gap: 10px;
        }

        .bottom-btn {
            width: 44px;
            height: 44px;
            background-color: #2f5d50;
            border: 2px solid #ffffff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .timer-container {
            flex-grow: 1;
            height: 42px;
            background-color: #d1d5db;
            border: 3px solid #4b5563;
            border-radius: 22px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #004b87, #0072ce);
            border-radius: 18px;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .timer-fill.warning {
            background: linear-gradient(to right, #b71c1c, #e53935);
        }

        /* 开始/结算覆盖全屏界面 */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 62, 80, 0.92);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border-radius: 32px;
        }

        .overlay-title {
            font-size: 60px;
            font-weight: 900;
            color: #ffeb3b;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 20px rgba(255,235,59,0.4);
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .stats-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px 48px;
            border-radius: 20px;
            margin-bottom: 32px;
            text-align: center;
        }

        .stat-item {
            font-size: 24px;
            margin: 10px 0;
            color: #e2e8f0;
        }

        .stat-value {
            font-weight: bold;
            color: #ffffff;
        }

        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #16a34a;
            transform: scale(1.05);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* 广播提示（如无缝切换到终极挑战时提示） */
        .toast-notification {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(220, 38, 38, 0.95);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 2px solid #ff8a80;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 50;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 背景图（雪山造型） -->
        <div class="mountain-bg">
            <div class="mountain mountain-1"></div>
            <div class="mountain mountain-2"></div>
            <div class="mountain-range"></div>
        </div>

        <!-- 顶部功能栏 -->
        <div class="top-bar">
            <div class="mode-banner" id="modeBanner">练习模式</div>
            <div class="top-right-controls">
                <button class="icon-btn active" id="audioToggleBtn" title="发音/声音控制">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </div>

        <!-- 切换提示框 -->
        <div class="toast-notification" id="toast">⚠️ 终极挑战开启！零容错 30 题！</div>

        <!-- 目标词汇卡片 -->
        <div class="target-container">
            <div class="target-card" id="targetCard">
                <div class="target-text" id="targetWord">---</div>
            </div>
            <!-- 终极挑战模式倒计时徽章 -->
            <div class="challenge-badge hidden" id="challengeBadge">30</div>
        </div>

        <!-- 选项按钮（两行：上3下2） -->
        <div class="options-container">
            <div class="options-row" id="row1"></div>
            <div class="options-row" id="row2"></div>
        </div>

        <!-- 底部控制与计时条 -->
        <div class="bottom-bar">
            <div class="bottom-left-btns">
                <button class="bottom-btn" id="restartBtn" title="重新开始">
                    <svg style="width:22px;height:22px;fill:currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>
            <div class="timer-container">
                <div class="timer-fill" id="timerFill"></div>
            </div>
        </div>

        <!-- 开始/结果遮罩界面 -->
        <div class="overlay-screen" id="overlay">
            <div class="overlay-title" id="overlayTitle">词汇复习挑战</div>
            <div class="stats-box hidden" id="statsBox">
                <div class="stat-item">正确答对: <span class="stat-value" id="statCorrect">0</span></div>
                <div class="stat-item">选择错误: <span class="stat-value" id="statMisses">0</span></div>
                <div class="stat-item">准确率: <span class="stat-value" id="statAccuracy">100%</span></div>
            </div>
            <button class="action-btn" id="startBtn">开始游戏</button>
        </div>
    </div>

    <script>
        // 词汇数据库（31个来自图片的通用及专业词汇）
        const vocabList = [
            { hz: "包含", py: "bāohán", en: "contain; include" },
            { hz: "依次", py: "yīcì", en: "in order; sequentially" },
            { hz: "加工", py: "jiāgōng", en: "process; manufacture" },
            { hz: "关键", py: "guānjiàn", en: "critical/key" },
            { hz: "含量", py: "hánliàng", en: "content" },
            { hz: "几乎", py: "jīhū", en: "almost; nearly" },
            { hz: "涉及", py: "shèjí", en: "involve; concern" },
            { hz: "品质", py: "pǐnzhì", en: "quality" },
            { hz: "蛋白质", py: "dànbáizhì", en: "protein" },
            { hz: "消化", py: "xiāohuà", en: "digest" },
            { hz: "分解", py: "fēnjiě", en: "decompose; break down" },
            { hz: "人体", py: "réntǐ", en: "human body" },
            { hz: "吸收", py: "xīshōu", en: "absorb" },
            { hz: "奶制品", py: "nǎizhìpǐn", en: "dairy products" },
            { hz: "豆制品", py: "dòuzhìpǐn", en: "soya products" },
            { hz: "维持", py: "wéichí", en: "maintain; sustain" },
            { hz: "能量", py: "néngliàng", en: "energy" },
            { hz: "廉价", py: "liánjià", en: "inexpensive; cheap" },
            { hz: "淀粉", py: "diànfěn", en: "starch" },
            { hz: "氨基酸", py: "ānjīsuān", en: "amino acid" },
            { hz: "碳水化合物", py: "tànshuǐ-huàhéwù", en: "carbohydrate" },
            { hz: "单糖", py: "dāntáng", en: "monosaccharide" },
            { hz: "低聚糖", py: "dījùtáng", en: "oligosaccharide" },
            { hz: "多糖", py: "duōtáng", en: "polysaccharide" },
            { hz: "葡萄糖", py: "pútáotáng", en: "glucose" },
            { hz: "乳糖", py: "rǔtáng", en: "lactose" },
            { hz: "水解度", py: "shuǐjiědù", en: "hydrolysis degree" },
            { hz: "蔗糖", py: "zhètáng", en: "sucrose" },
            { hz: "麦芽糖", py: "màiyátáng", en: "maltose" },
            { hz: "棉子糖", py: "miánzǐtáng", en: "raffinose" },
            { hz: "块茎", py: "kuàijīng", en: "tuber" }
        ];

        // 游戏状态变量
        let currentMode = 'practice'; // 'practice' (练习模式) 或 'challenge' (终极挑战)
        let isAudioEnabled = true;
        let currentTarget = null;
        let currentOptions = [];
        let timerInterval = null;
        let distractorTimer = null;
        
        let practiceTimeMax = 12.0;
        let practiceTimeLeft = 12.0;
        
        let challengeQuestionsLeft = 30;
        let practiceStreak = 0; // 练习模式连胜计数，用于自动开启终极挑战
        let triggerThreshold = 8; // 连续答对8题后在不确定时刻触发挑战

        let stats = {
            correct: 0,
            misses: 0
        };

        // DOM 元素引用
        const targetWordEl = document.getElementById('targetWord');
        const targetCardEl = document.getElementById('targetCard');
        const row1El = document.getElementById('row1');
        const row2El = document.getElementById('row2');
        const timerFillEl = document.getElementById('timerFill');
        const modeBannerEl = document.getElementById('modeBanner');
        const challengeBadgeEl = document.getElementById('challengeBadge');
        const audioToggleBtn = document.getElementById('audioToggleBtn');
        const restartBtn = document.getElementById('restartBtn');
        const overlayEl = document.getElementById('overlay');
        const overlayTitleEl = document.getElementById('overlayTitle');
        const statsBoxEl = document.getElementById('statsBox');
        const statCorrectEl = document.getElementById('statCorrect');
        const statMissesEl = document.getElementById('statMisses');
        const statAccuracyEl = document.getElementById('statAccuracy');
        const startBtn = document.getElementById('startBtn');
        const toastEl = document.getElementById('toast');

        // 音频播放 (语音合成 Synth & 简单音效 Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!isAudioEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'trigger') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function speakChinese(text) {
            if (!isAudioEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // 初始化/重置游戏
        function startGame() {
            stats.correct = 0;
            stats.misses = 0;
            practiceStreak = 0;
            currentMode = 'practice';
            
            // 随机设定触发终极挑战的阈值 (连续答对 6 ~ 10 题不定时触发)
            triggerThreshold = Math.floor(Math.random() * 5) + 6;

            modeBannerEl.textContent = '练习模式';
            modeBannerEl.style.backgroundColor = 'rgba(255, 255, 255, 0.25)';
            challengeBadgeEl.classList.add('hidden');

            overlayEl.classList.add('hidden');
            nextQuestion();
        }

        // 无缝开启终极挑战模式
        function triggerChallengeMode() {
            currentMode = 'challenge';
            challengeQuestionsLeft = 30;

            modeBannerEl.textContent = '🔥 终极挑战模式 (零容错)';
            modeBannerEl.style.backgroundColor = '#d84315';
            
            challengeBadgeEl.textContent = challengeQuestionsLeft;
            challengeBadgeEl.classList.remove('hidden');

            playSound('trigger');

            // 弹出短暂 Toast 广播
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2000);
        }

        // 生成下一题
        function nextQuestion() {
            clearInterval(timerInterval);
            clearInterval(distractorTimer);

            // 检查练习模式下是否满足不定时触发终极挑战
            if (currentMode === 'practice' && practiceStreak >= triggerThreshold) {
                triggerChallengeMode();
            }

            // 随机挑选目标词
            const randomIndex = Math.floor(Math.random() * vocabList.length);
            currentTarget = vocabList[randomIndex];

            targetWordEl.textContent = currentTarget.hz;
            speakChinese(currentTarget.hz);

            // 生成4个干扰项
            let distractors = vocabList.filter(item => item.hz !== currentTarget.hz);
            distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 4);

            currentOptions = [...distractors, currentTarget].sort(() => 0.5 - Math.random());

            // 渲染选项按钮（上3下2）
            row1El.innerHTML = '';
            row2El.innerHTML = '';

            currentOptions.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.dataset.hz = opt.hz;

                btn.innerHTML = `
                    <div class="pinyin-text">${opt.py}</div>
                    <div class="english-text">${opt.en}</div>
                `;

                btn.addEventListener('click', () => handleOptionClick(btn, opt));

                if (idx < 3) {
                    row1El.appendChild(btn);
                } else {
                    row2El.appendChild(btn);
                }
            });

            // 启动不同模式的计时器与干扰项消退机制
            if (currentMode === 'practice') {
                startPracticeTimer();
                setupDistractorFading();
            } else {
                startChallengeTimer();
            }
        }

        // 练习模式计时器与干扰项逐渐消失逻辑
        function startPracticeTimer() {
            practiceTimeMax = 12.0;
            practiceTimeLeft = practiceTimeMax;
            updateTimerBar(100);

            timerInterval = setInterval(() => {
                practiceTimeLeft -= 0.1;
                const percentage = (practiceTimeLeft / practiceTimeMax) * 100;
                updateTimerBar(percentage);

                if (practiceTimeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(distractorTimer);
                    // 时间耗尽算作一次错误，但在练习模式下继续下一题
                    stats.misses++;
                    practiceStreak = 0; // 重置连胜
                    playSound('wrong');
                    nextQuestion();
                }
            }, 100);
        }

        // 干扰项随时间逐一消失
        function setupDistractorFading() {
            let optionsBtns = Array.from(document.querySelectorAll('.option-btn'));
            let distractorBtns = optionsBtns.filter(btn => btn.dataset.hz !== currentTarget.hz);
            
            // 洗牌干扰项顺序
            distractorBtns.sort(() => 0.5 - Math.random());

            let fadeIndex = 0;
            // 每 2.2 秒消失一个干扰项，直到只剩正确答案
            distractorTimer = setInterval(() => {
                if (fadeIndex < distractorBtns.length) {
                    distractorBtns[fadeIndex].classList.add('fade-out');
                    fadeIndex++;
                } else {
                    clearInterval(distractorTimer);
                }
            }, 2200);
        }

        // 终极挑战模式计时器（固定每题 5 秒）
        function startChallengeTimer() {
            let challengeTimeLeft = 5.0;
            updateTimerBar(100);

            timerInterval = setInterval(() => {
                challengeTimeLeft -= 0.1;
                const percentage = (challengeTimeLeft / 5.0) * 100;
                updateTimerBar(percentage);

                if (challengeTimeLeft <= 0) {
                    clearInterval(timerInterval);
                    // 终极模式超时直接判定输局
                    handleChallengeFailure("超时！终极挑战失败！");
                }
            }, 100);
        }

        // 更新底部计时条
        function updateTimerBar(percentage) {
            const clamped = Math.max(0, Math.min(100, percentage));
            timerFillEl.style.width = clamped + '%';
            if (clamped < 25) {
                timerFillEl.classList.add('warning');
            } else {
                timerFillEl.classList.remove('warning');
            }
        }

        // 点击选项处理
        function handleOptionClick(btnEl, optionData) {
            const isCorrect = optionData.hz === currentTarget.hz;

            if (isCorrect) {
                btnEl.classList.add('correct');
                playSound('correct');
                stats.correct++;

                if (currentMode === 'practice') {
                    practiceStreak++;
                    // 练习模式答对加时间调试
                    practiceTimeLeft = Math.min(practiceTimeMax, practiceTimeLeft + 2.5);
                    setTimeout(nextQuestion, 300);
                } else {
                    // 终极挑战模式
                    challengeQuestionsLeft--;
                    challengeBadgeEl.textContent = challengeQuestionsLeft;

                    if (challengeQuestionsLeft <= 0) {
                        // 零错误完成30题，赢得终极胜利！
                        handleChallengeVictory();
                    } else {
                        setTimeout(nextQuestion, 250);
                    }
                }
            } else {
                btnEl.classList.add('wrong');
                playSound('wrong');
                stats.misses++;
                practiceStreak = 0; // 选错中断连胜

                if (currentMode === 'practice') {
                    // 练习模式下即使选错，计时器仍在继续，允许继续选
                } else {
                    // 终极挑战模式：一错即终，直接输局！
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        handleChallengeFailure("答错一题！终极挑战失败！");
                    }, 400);
                }
            }
        }

        // 终极挑战失败处理
        function handleChallengeFailure(reason) {
            overlayTitleEl.textContent = "YOU LOSE";
            overlayTitleEl.style.color = "#ff5252";
            showEndStats();
        }

        // 终极挑战胜利处理
        function handleChallengeVictory() {
            clearInterval(timerInterval);
            overlayTitleEl.textContent = "YOU WIN";
            overlayTitleEl.style.color = "#ffeb3b";
            showEndStats();
        }

        // 显示结算界面
        function showEndStats() {
            statCorrectEl.textContent = stats.correct;
            statMissesEl.textContent = stats.misses;
            
            const total = stats.correct + stats.misses;
            const accuracy = total > 0 ? Math.round((stats.correct / total) * 100) : 100;
            statAccuracyEl.textContent = accuracy + "%";

            statsBoxEl.classList.remove('hidden');
            startBtn.textContent = "再次挑战";
            overlayEl.classList.remove('hidden');
        }

        // 事件监听绑定
        targetCardEl.addEventListener('click', () => {
            if (currentTarget) speakChinese(currentTarget.hz);
        });

        audioToggleBtn.addEventListener('click', () => {
            isAudioEnabled = !isAudioEnabled;
            audioToggleBtn.classList.toggle('active', isAudioEnabled);
        });

        restartBtn.addEventListener('click', startGame);
        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
